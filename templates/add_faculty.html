{% extends "base_admin.html" %}
{% block title %}Add Faculty{% endblock %}

{% block nav %}
<nav class="border-b border-border bg-background/80 px-4 py-4 backdrop-blur-md">
  <div class="mx-auto max-w-7xl flex justify-between items-center">
    <a href="/edit_faculty/" class="text-lg font-bold text-primary">Back</a>
  </div>
</nav>
{% endblock %}

{% block content %}
        <div class="mb-8">
          <h1 class="text-3xl font-bold tracking-tight">Add Faculty Member</h1>
        </div>

        {% if messages %}
          <div class="mb-6 space-y-3">
            {% for message in messages %}
              <div class="rounded-lg border border-green-200 bg-green-50 p-4 text-green-800">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}

        <form method="post" enctype="multipart/form-data" action="/add_faculty/" class="bg-white rounded-2xl shadow p-8">
          {% csrf_token %}
          <input type="hidden" name="form_type" value="add_faculty">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Name</label>
              <input required type="text" name="name"
                     class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-ring outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Level</label>
              <input type="text" name="level"
                     class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-ring outline-none">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium mb-1">Designation</label>
              <input type="text" name="designation"
                     class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-ring outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Phone Number</label>
              <input type="number" name="ph_number"
                     class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-ring outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Photo</label>
              <input type="file" name="image" accept="image/*"
                     class="w-full text-sm">
            </div>
          </div>

          <div class="flex justify-end mt-6 space-x-3">
            <button type="submit" onclick="this.textContent='Adding...'; this.disabled=true; this.classList.add('opacity-75', 'cursor-not-allowed'); this.form.submit();"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-lg">
              Add Member
            </button>
          </div>
        </form>
{% endblock %}
