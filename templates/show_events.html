{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Events — Shantinagar English School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="{% static 'dist/styles.css' %}" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-background text-foreground flex flex-col">
    <nav class="border-b border-border bg-background/80 px-4 py-4 backdrop-blur-md">
      <div class="mx-auto max-w-7xl flex justify-between items-center">
        <a href="/dashboard/"><span class="text-lg font-bold text-primary">Back to Dashboard</span></a>
      </div>
    </nav>

    <main class="flex-1 p-6 sm:p-10">
      <div class="mx-auto max-w-5xl">
        <h1 class="text-3xl font-bold tracking-tight mb-8">All Events</h1>
        <div class="flex justify-center mb-6">
          <a href="{% url 'add_event' %}"
             class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg inline-flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 4v16m8-8H4" />
            </svg>
            Add Event
          </a>
        </div>

        <div class="bg-white rounded-2xl shadow p-8">

          {% if events %}
            <div class="space-y-4">
              {% for event in events %}
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-100 pb-4">
                  <div>
                    <h3 class="font-medium text-lg">{{ event.event_name }}</h3>
                    <p class="text-sm text-gray-500">{{ event.event_date }}</p>
                  </div>

                  <div class="flex gap-3">
                    <a href="{% url 'edit_event' event.id %}"
                       class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg">
                      Edit
                    </a>

                    <a href="{% url 'delete_event' event.id %}"
                       class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-lg"
                       onclick="return confirm('Are you sure you want to delete this event and all its images?')">
                      Delete
                    </a>
                  </div>
                </div>
              {% endfor %}
            </div>
          {% else %}
            <p class="text-gray-500">No events created yet.</p>
          {% endif %}
        </div>
      </div>
    </main>
  </body>
</html>
