{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Months</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="{% static 'dist/styles.css' %}" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-background text-foreground flex flex-col">

    <nav class="border-b border-border bg-background/80 px-4 py-4 backdrop-blur-md">
      <div class="mx-auto max-w-7xl flex justify-between items-center">
        <a href="/dashboard/"><span class="text-lg font-bold text-primary">Back to Dashboard</span></a>
        <a href="/logout/" class="text-lg font-bold text-primary">Log Out</a>
      </div>
    </nav>

    <main class="flex-1 p-6 sm:p-10">
      <div class="mx-auto max-w-5xl">

          <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold tracking-tight">Calendar</h1>
          </div>

          <p class="mt-2 text-sm text-muted-foreground mb-8">
            Select a month to view and manage school events and holidays for that month.
          </p>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {% for month_id, month_name in months %}
                  <a href="{% url 'show_calender' month_id %}"
                     class="group block rounded-[24px] border border-border bg-card p-6 shadow-md transition-shadow hover:shadow-xl">
                      <h2 class="text-xl font-semibold text-primary">{{ month_name }}</h2>
                  </a>
              {% endfor %}
          </div>

      </div>
    </main>

    <script>

    </script>

  </body>
</html>
