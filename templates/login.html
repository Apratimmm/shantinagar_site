<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In — Shantinagar English School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "oklch(0.995 0.003 95)",
              foreground: "oklch(0.24 0.03 200)",
              card: "oklch(1.0 0 95)",
              primary: "#2a52be",
              "primary-foreground": "oklch(0.98 0.01 200)",
              border: "oklch(0.24 0.03 200 / 0.12)",
            },
            fontFamily: {
              sans: ['"Inter"', "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body { font-family: "Inter", system-ui, sans-serif; }
    </style>
  </head>
  <body class="min-h-screen bg-background text-foreground flex flex-col">
  {% if messages %}
      {% for message in messages %}
        <div class="mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    {% load static %}
    
    <nav class="border-b border-border bg-background/80 px-4 py-4 backdrop-blur-md">
      <div class="mx-auto max-w-7xl">
        <a href="/" class="text-sm font-semibold text-primary hover:underline">Back to Home</a>
      </div>
    </nav>

    <main class="flex flex-1 items-center justify-center p-6">
      <div class="w-full max-w-md rounded-[24px] border border-border bg-card p-8 shadow-xl">
        <div class="mb-8 text-center">
          <h1 class="text-2xl font-bold tracking-tight">Welcome back</h1>
          <p class="mt-2 text-sm text-foreground/70">Please enter your details to sign in.</p>
        </div>
        
        <form action="/verify_user/" method="POST" class="space-y-5">
          {% csrf_token %}
          <div>
            <label for="name" class="block text-sm font-medium text-foreground">Username</label>
            <input type="text" name="name" id="name" required class="mt-1 block w-full rounded-md border border-border bg-background px-3 py-2 text-sm shadow-sm focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" />
          </div>
          
          <div>
            <label for="password" class="block text-sm font-medium text-foreground">Password</label>
            <input type="password" name="password" id="password" required class="mt-1 block w-full rounded-md border border-border bg-background px-3 py-2 text-sm shadow-sm focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" />
          </div>
          
          <div class="pt-2">
           <button type="submit" class="w-full rounded-full bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground shadow transition-colors hover:bg-primary/90">
              Sign In
            </button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
