{% extends "base_admin.html" %}
{% block title %}Add Notice{% endblock %}

{% block nav %}
<nav class="border-b border-border bg-background/80 px-4 py-4 backdrop-blur-md">
  <div class="mx-auto max-w-7xl flex justify-between items-center">
    <a href="{% url 'show_notices' %}"><span class="text-lg font-bold text-primary">Back to Notices</span></a>
  </div>
</nav>
{% endblock %}

{% block content %}
        <h1 class="text-3xl font-bold tracking-tight mb-8">Add Notice</h1>

        <div class="bg-white rounded-2xl shadow p-8 mb-10">

          <form method="POST" id="notice-form" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Type toggle -->
            <div class="mb-8">
              <label class="block text-sm font-medium mb-3" id="label-type">Type</label>
              <div class="flex gap-3" id="type-btns">
                <button type="button" id="type-text" onclick="selectType('text')"
                        class="type-btn flex-1 py-3 rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-700 text-sm font-semibold transition-colors">
                  <div class="text-base font-bold text-blue-700">Text</div>
                </button>
                <button type="button" id="type-photo" onclick="selectType('photo')"
                        class="type-btn flex-1 py-3 rounded-lg border-2 border-gray-300 bg-white text-gray-900 text-sm font-semibold transition-colors">
                  <div class="text-base font-bold text-gray-900">Photo</div>
                </button>
              </div>
              <input type="hidden" name="notice_type" id="type-input" value="text">
            </div>

            <!-- Language selection -->
            <div class="mb-8">
              <label class="block text-sm font-medium mb-3">Language / भाषा</label>
              <div class="flex gap-3">
                <button type="button" id="lang-en" onclick="selectLanguage('en')"
                        class="lang-btn flex-1 py-3 rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-700 text-sm font-semibold transition-colors">
                  <div class="text-base font-bold text-blue-700">English</div>
                </button>
                <button type="button" id="lang-ne" onclick="selectLanguage('ne')"
                        class="lang-btn flex-1 py-3 rounded-lg border-2 border-gray-300 bg-white text-gray-900 text-sm font-semibold transition-colors">
                  <div class="text-base font-bold text-gray-900">नेपाली</div>
                </button>
              </div>
              <input type="hidden" name="language" id="language-input" value="en">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div>
                <label class="block text-sm font-medium mb-1" id="label-title">Title</label>
                <input type="text" name="title" required
                       value="{{ title|default:'' }}"
                       class="w-full border rounded-lg px-4 py-2">
              </div>

              <div>
                <label class="block text-sm font-medium mb-1" id="label-date">Date ( format: day/month/year )</label>
                <input type="text" name="date" required
                       value="{{ date|default:'' }}"
                       class="w-full border rounded-lg px-4 py-2"
                       placeholder="e.g. Baisakh 20, 2083">
              </div>
            </div>

            <!-- Body shown only for text -->
            <div class="mb-6" id="body-section">
              <label class="block text-sm font-medium mb-1" id="label-body">Body</label>
              <textarea name="body" rows="10" id="body-text"
                        class="w-full border rounded-lg px-4 py-2">{{ body|default:'' }}</textarea>
            </div>

            <!-- Image shown only for photo -->
            <div class="mb-6 hidden" id="image-section">
              <label class="block text-sm font-medium mb-1" id="label-image">Photo</label>
              <input type="file" name="notice_image" accept="image/*" multiple id="image-input"
                     class="w-full border rounded-lg px-4 py-2 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <button type="submit"
                    onclick="this.textContent='Creating...'; this.disabled=true; this.classList.add('opacity-75', 'cursor-not-allowed'); this.form.submit();"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg">
              <span id="btn-text">Create</span>
            </button>
          </form>
        </div>
{% endblock %}

{% block extra_js %}
<script>
  const ACTIVE = ["border-blue-600", "bg-blue-50", "text-blue-700"];
  const INACTIVE = ["border-gray-300", "bg-white", "text-gray-900"];
  const labels = {
    en: { title: "Title", date: "Date ( format: day/month/year )", body: "Body" },
    ne: { title: "शीर्षक", date: "मिति ( दिन/महिना/वर्ष )", body: "विवरण" }
  };

  function setButton(btn, active) {
    const add = active ? ACTIVE : INACTIVE;
    const remove = active ? INACTIVE : ACTIVE;
    btn.classList.remove(...remove);
    btn.classList.add(...add);
    const title = btn.querySelector("div:first-child");
    const sub = btn.querySelector("div:last-child");
    if (active) {
      title.classList.remove("text-gray-900");
      title.classList.add("text-blue-700");
      sub.classList.remove("text-gray-500");
      sub.classList.add("text-blue-700");
    } else {
      title.classList.remove("text-blue-700");
      title.classList.add("text-gray-900");
      sub.classList.remove("text-blue-700");
      sub.classList.add("text-gray-500");
    }
  }

  function selectLanguage(lang) {
    document.getElementById("language-input").value = lang;
    const en = document.getElementById("lang-en");
    const ne = document.getElementById("lang-ne");
    setButton(en, lang === "en");
    setButton(ne, lang === "ne");
    const L = labels[lang];
    document.getElementById("label-title").textContent = L.title;
    document.getElementById("label-date").textContent = L.date;
    document.getElementById("label-body").textContent = L.body;
  }

  function selectType(t) {
    document.getElementById("type-input").value = t;
    const textBtn = document.getElementById("type-text");
    const photoBtn = document.getElementById("type-photo");
    setButton(textBtn, t === "text");
    setButton(photoBtn, t === "photo");

    const bodySec = document.getElementById("body-section");
    const imageSec = document.getElementById("image-section");
    const bodyArea = document.getElementById("body-text");

    if (t === "text") {
      bodySec.classList.remove("hidden");
      imageSec.classList.add("hidden");
      bodyArea.setAttribute("required", "required");
      document.getElementById("image-input").removeAttribute("required");
    } else {
      bodySec.classList.add("hidden");
      imageSec.classList.remove("hidden");
      bodyArea.removeAttribute("required");
      document.getElementById("image-input").setAttribute("required", "required");
    }
  }

  // Init
  selectLanguage(document.getElementById("language-input").value);
  selectType(document.getElementById("type-input").value || "text");
</script>
{% endblock %}
